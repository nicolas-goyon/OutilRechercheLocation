# Serveur local de suivi de recherche logement — BUILD LOCAL depuis les sources (développement).
# Pour utiliser l'image publiée par la CI (avec mise à jour) : deploy/docker-compose.yml.
#   docker compose up -d --build     puis ouvrir http://localhost:5080
#   docker compose logs server | grep "Token API"   (affiche le token. Le coller dans le plugin : panneau 🏠 > Connexion.)
services:
  server:
    build: ./server
    image: recherche-logement-server:local
    container_name: recherche-logement
    ports:
      # Lié à 127.0.0.1 uniquement. Le réseau n'a donc pas accès au serveur local.
      - "127.0.0.1:5080:8080"
    environment:
      RechercheLogement__PublicUrl: "http://localhost:5080"
      # Token fixe. Sans cette variable, le serveur génère un token au premier démarrage (visible dans Paramètres).
      # RechercheLogement__ApiToken: "change-moi"
    volumes:
      - recherche-logement-data:/data
    restart: unless-stopped

volumes:
  recherche-logement-data:
