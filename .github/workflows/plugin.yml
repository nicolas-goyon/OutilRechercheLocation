name: Plugin — test & publication (jsDelivr + GitHub Release, mise à jour auto)

# À chaque nouvelle version `plugin-vX.Y.Z` :
#   - plugin/dist/ (le bundle) est commité sur le tag, servi par jsDelivr :
#       https://cdn.jsdelivr.net/gh/<owner>/<repo>@plugin-vX.Y.Z/plugin/dist/recherche-logement.js
#   - plugin/dist/<id>.user.js + .meta.js (un par plugin/userscripts/<id>.mjs) sont
#     attachés à une GitHub Release. Les scripts installés interrogent
#       https://github.com/<owner>/<repo>/releases/latest/download/<id>.meta.js
#     et se mettent à jour quand son @version est plus élevé.
#     ⚠ Seul ce workflow publie des GitHub Releases dans ce dépôt : "latest" = dernier plugin.
#
# - Pull request / push touchant plugin/ : typecheck + tests + build.
# - Push sur main : en plus, publication d'un nouveau tag (patch par défaut,
#   "[minor]" ou "[major]" dans un message de commit pour monter plus haut).
# - workflow_dispatch : republier un tag existant ("tag") ou forcer une montée ("bump").

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à reconstruire (ex. plugin-v0.2.0) — vide pour une nouvelle version'
        required: false
      bump:
        description: 'Montée de version (ignorée si "tag" est renseigné)'
        required: false
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: plugin

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vérifier le bundle
        run: test -s dist/recherche-logement.js && echo "OK ($(wc -c < dist/recherche-logement.js) octets)"

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculer le tag
        id: tag
        working-directory: .
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"; echo "existing=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${INPUT_BUMP:-patch}"
          else
            if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              messages="$(git log -1 --pretty=%B "$AFTER_SHA")"
            else
              messages="$(git log --pretty=%B "${BEFORE_SHA}..${AFTER_SHA}")"
            fi
            if grep -qi '\[major\]' <<< "$messages"; then bump=major
            elif grep -qi '\[minor\]' <<< "$messages"; then bump=minor
            else bump=patch; fi
          fi
          latest="$(git tag -l 'plugin-v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          latest="${latest:-plugin-v0.1.0}"
          IFS='.' read -r major minor patch <<< "${latest#plugin-v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          tag="plugin-v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Le tag ${tag} existe déjà."; exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"; echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Se placer sur le tag existant
        if: steps.tag.outputs.existing == 'true'
        working-directory: .
        run: git checkout "${{ steps.tag.outputs.name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build (version = tag publié)
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
        run: npm run build

      - name: Vérifier le bundle et les userscripts
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          test -s dist/recherche-logement.js || { echo "::error::bundle absent"; exit 1; }
          shopt -s nullglob
          scripts=(dist/*.user.js)
          [ ${#scripts[@]} -gt 0 ] || { echo "::error::aucun dist/*.user.js"; exit 1; }
          for u in "${scripts[@]}"; do
            grep -q "^// @version *${TAG#plugin-v}\$" "$u" || { echo "::error::$u : @version incorrect"; exit 1; }
            grep -q "@${TAG}/plugin/dist/recherche-logement.js" "$u" || { echo "::error::$u ne @require pas le bundle ${TAG}"; exit 1; }
            ! grep -qi 'apiToken' "$u" || { echo "::error::$u contient un token"; exit 1; }
            test -s "${u%.user.js}.meta.js" || { echo "::error::${u%.user.js}.meta.js absent"; exit 1; }
            echo "OK : $u"
          done

      - name: Commiter dist/ sur le tag et le pousser
        working-directory: .
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f plugin/dist/
          if git diff --cached --quiet; then echo "dist/ inchangé"; exit 0; fi
          git commit -m "ci(build): plugin dist pour ${TAG}"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force

      # Seul le tag le plus élevé est marqué "latest" : les scripts installés suivent
      # releases/latest, republier un ancien tag ne doit pas les faire revenir en arrière.
      - name: Publier les userscripts en assets de GitHub Release
        working-directory: .
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(plugin/dist/*.user.js plugin/dist/*.meta.js)
          highest="$(git tag -l 'plugin-v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          if [ "$highest" = "$TAG" ]; then latest=true; else latest=false; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --latest="$latest"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "Plugin ${TAG#plugin-}" --generate-notes --latest="$latest"
          fi
          {
            echo "### ${TAG} (latest=${latest})"
            echo "- Installation / mise à jour : https://github.com/${{ github.repository }}/releases/latest/download/recherche-logement.user.js"
            echo "- Bundle : https://cdn.jsdelivr.net/gh/${{ github.repository }}@${TAG}/plugin/dist/recherche-logement.js"
          } >> "$GITHUB_STEP_SUMMARY"
