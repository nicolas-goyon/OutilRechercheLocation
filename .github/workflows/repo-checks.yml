name: Dépôt

# Contrôles transverses : workflows (actionlint), scripts shell (shellcheck) et PowerShell (PSScriptAnalyzer).
# Les failles des dépendances sont vérifiées par les tâches « Audit » des workflows Serveur et Plugin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  scripts:
    name: Scripts (shellcheck, PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/update.sh update-local.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # PowerShell Gallery répond parfois « No match was found » : module déjà présent sur l'image, sinon 4 essais.
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            foreach ($try in 1..4) {
              try { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -ErrorAction Stop; break }
              catch { if ($try -eq 4) { throw }; Write-Warning "PowerShell Gallery : essai $try échoué ($_)"; Start-Sleep -Seconds (15 * $try) }
            }
          }
          $issues = Invoke-ScriptAnalyzer -Path deploy/update.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer : $($issues.Count) problème(s)" }
