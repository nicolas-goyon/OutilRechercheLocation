name: Serveur — build, tests & image Docker

# - Pull request / push touchant server/ : build + tests (.NET 10).
# - Push sur main : en plus, image Docker publiée sur GitHub Container Registry :
#     ghcr.io/nicolas-goyon/outilrecherchelocation-server:latest  et  :sha-<commit>

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - run: dotnet restore tests/RechercheLogement.Tests/RechercheLogement.Tests.csproj
      - run: dotnet build tests/RechercheLogement.Tests/RechercheLogement.Tests.csproj --no-restore -c Release
      - run: dotnet test tests/RechercheLogement.Tests/RechercheLogement.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

  docker:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (minuscules)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: VERSION=0.2.${{ github.run_number }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
