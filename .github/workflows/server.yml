name: Serveur — build, tests, image Docker & docker-compose

# - Pull request / push touchant server/ ou deploy/ : build + tests (.NET 10) + validation du docker-compose.
# - Push sur main : en plus,
#     1. image Docker publiée sur GitHub Container Registry :
#          ghcr.io/nicolas-goyon/outilrecherchelocation-server:latest | :<version> | :sha-<commit>
#     2. docker-compose.yml + scripts de mise à jour publiés :
#          - en artefact du run ("server-deploy"),
#          - sur la release GitHub "server-latest" (adresse fixe, toujours la dernière version) :
#            https://github.com/<owner>/<repo>/releases/download/server-latest/docker-compose.yml
#        ⚠ Cette release est une "pre-release" : elle ne devient jamais "latest". La release
#          "latest" reste celle du plugin (mise à jour automatique de Tampermonkey).

on:
  push:
    branches: [main]
    paths: ['server/**', 'deploy/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'deploy/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - run: dotnet restore tests/RechercheLogement.Tests/RechercheLogement.Tests.csproj
      - run: dotnet build tests/RechercheLogement.Tests/RechercheLogement.Tests.csproj --no-restore -c Release
      - run: dotnet test tests/RechercheLogement.Tests/RechercheLogement.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
      - name: Valider deploy/docker-compose.yml
        working-directory: deploy
        run: docker compose -f docker-compose.yml config --quiet

  docker:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag + release "server-latest"
      packages: write   # image GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Nom et version de l'image
        id: img
        working-directory: .
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
          echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: VERSION=${{ steps.img.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}

      - name: Préparer le docker-compose publié
        working-directory: .
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Nom d'image et liens calculés pour ce dépôt (identiques sur le dépôt d'origine).
          sed -e "s#ghcr.io/nicolas-goyon/outilrecherchelocation-server#${IMAGE}#g" \
              -e "s#nicolas-goyon/OutilRechercheLocation#${REPO}#g" \
              deploy/docker-compose.yml > out/docker-compose.yml
          cp deploy/update.sh deploy/update.ps1 out/
          chmod +x out/update.sh
          docker compose -f out/docker-compose.yml config --quiet

      - uses: actions/upload-artifact@v4
        with:
          name: server-deploy
          path: out/
          if-no-files-found: error

      - name: Publier sur la release "server-latest"
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.img.outputs.name }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f server-latest "$GITHUB_SHA"
          git push -f origin refs/tags/server-latest
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/server-latest"
          cat > notes.md <<NOTES
          Serveur local **v${VERSION}** — image \`${IMAGE}:latest\` (aussi \`:${VERSION}\` et \`:sha-${GITHUB_SHA}\`).

          **Installation** (dans un dossier vide) :
          \`\`\`
          curl -LO ${base}/docker-compose.yml
          docker compose up -d
          \`\`\`
          Windows (PowerShell) : \`Invoke-WebRequest ${base}/docker-compose.yml -OutFile docker-compose.yml\`, puis \`docker compose up -d\`.
          Puis ouvrir http://localhost:5080 (page Paramètres : token du plugin).

          **Mise à jour** : \`docker compose up -d --pull always\`, ou les scripts \`update.sh\` / \`update.ps1\`.
          Les données (volume Docker) sont conservées.

          **Revenir à cette version** : \`RL_TAG=${VERSION} docker compose up -d\`
          NOTES
          if gh release view server-latest >/dev/null 2>&1; then
            gh release edit server-latest --title "Serveur (Docker) — v${VERSION}" --notes-file notes.md --prerelease
          else
            gh release create server-latest --verify-tag --title "Serveur (Docker) — v${VERSION}" --notes-file notes.md --prerelease
          fi
          gh release upload server-latest out/docker-compose.yml out/update.sh out/update.ps1 --clobber
          {
            echo "### Serveur v${VERSION}"
            echo "- Image : \`${IMAGE}:latest\` (\`:${VERSION}\`, \`:sha-${GITHUB_SHA}\`)"
            echo "- docker-compose : ${base}/docker-compose.yml"
            echo "- Mise à jour : \`docker compose up -d --pull always\` (ou update.sh / update.ps1)"
          } >> "$GITHUB_STEP_SUMMARY"
