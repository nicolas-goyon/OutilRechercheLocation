name: Serveur

# Vérifications du serveur (.NET), une tâche par sujet :
#   format      style du code (dotnet format)
#   build       compilation Release, avertissements = erreurs, analyse du code (AnalysisMode Recommended)
#   tests       tests unitaires + couverture (résumé dans la page du run)
#   audit       paquets NuGet avec une faille connue (élevée ou critique : échec)
#   docker      image construite, démarrée, puis interrogée (/health, pages, contours)
# Push sur main, après toutes les vérifications : image publiée sur GHCR et release "server-latest".
#   ⚠ "server-latest" est une pre-release : la release "latest" reste celle du plugin (mise à jour Tampermonkey).

on:
  push:
    branches: [main]
    paths: ['server/**', 'deploy/**', 'docker-compose.yml', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'deploy/**', 'docker-compose.yml', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - run: dotnet format RechercheLogement.sln --verify-no-changes --severity warn

  build:
    name: Build et analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
          cache: true
          cache-dependency-path: server/**/*.csproj
      - run: dotnet restore RechercheLogement.sln
      # TreatWarningsAsErrors (Directory.Build.props) : une alerte de l'analyse du code fait échouer la tâche.
      - run: dotnet build RechercheLogement.sln --no-restore -c Release

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
          cache: true
          cache-dependency-path: server/**/*.csproj
      - name: Tests (sans réseau) et couverture
        run: >
          dotnet test tests/RechercheLogement.Tests/RechercheLogement.Tests.csproj -c Release
          --logger "trx;LogFileName=tests.trx" --results-directory ../test-results
          --collect "XPlat Code Coverage"
      - name: Résumé de couverture
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: test-results/**/coverage.cobertura.xml
          format: markdown
          output: file
          thresholds: '50 70'
      - name: Publier le résumé
        if: always()
        working-directory: .
        run: |
          if [ -f code-coverage-results.md ]; then
            { echo '### Couverture du serveur'; cat code-coverage-results.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-test-results
          path: test-results/
          retention-days: 14

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - run: dotnet restore RechercheLogement.sln
      - name: Paquets vulnérables
        run: |
          set -euo pipefail
          dotnet list RechercheLogement.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -Eq '\b(High|Critical)\b' vulnerable.txt; then
            echo "::error::Paquet NuGet avec une faille élevée ou critique (voir ci-dessus)."
            exit 1
          fi

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: server
          load: true
          tags: recherche-logement:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrer et interroger le serveur
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name rl -p 8080:8080 -e RechercheLogement__ProjectsAutoRun=false recherche-logement:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"); echo "$code $1"; [ "$code" = "$2" ]; }
          check /health 200
          check / 200
          check /biens 200
          check /projets 200
          check /projets/nouveau 200
          check /geo/contours/department/65 200
          check /api/searches 401
          check /recommandations 200
          # Analyse des photos (recommandations) : la bibliothèque native de SkiaSharp doit se charger dans l'image.
          for _ in $(seq 1 30); do
            docker logs rl 2>&1 | grep -q "Analyse des photos" && break
            sleep 1
          done
          docker logs rl 2>&1 | grep "Analyse des photos"
          docker logs rl 2>&1 | grep -q "Analyse des photos prête"
      - name: Journal du conteneur
        if: always()
        working-directory: .
        run: docker logs rl 2>&1 | tail -50 || true
      - name: Valider les docker-compose
        working-directory: .
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f docker-compose.yml config --quiet

  publish:
    name: Publication (image et docker-compose)
    needs: [format, build, tests, audit, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag + release "server-latest"
      packages: write   # image GHCR
    steps:
      - uses: actions/checkout@v7
      - name: Nom et version de l'image
        id: img
        working-directory: .
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
          echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          build-args: VERSION=${{ steps.img.outputs.version }}
          cache-from: type=gha
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}

      - name: Préparer le docker-compose publié
        working-directory: .
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Nom d'image et liens calculés pour ce dépôt (identiques sur le dépôt d'origine).
          sed -e "s#ghcr.io/nicolas-goyon/outilrecherchelocation-server#${IMAGE}#g" \
              -e "s#nicolas-goyon/OutilRechercheLocation#${REPO}#g" \
              deploy/docker-compose.yml > out/docker-compose.yml
          cp deploy/update.sh deploy/update.ps1 out/
          chmod +x out/update.sh
          docker compose -f out/docker-compose.yml config --quiet

      - uses: actions/upload-artifact@v7
        with:
          name: server-deploy
          path: out/
          if-no-files-found: error

      - name: Publier sur la release "server-latest"
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.img.outputs.name }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f server-latest "$GITHUB_SHA"
          git push -f origin refs/tags/server-latest
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/server-latest"
          cat > notes.md <<NOTES
          Serveur local **v${VERSION}** — image \`${IMAGE}:latest\` (aussi \`:${VERSION}\` et \`:sha-${GITHUB_SHA}\`).

          **Installation** (dans un dossier vide) :
          \`\`\`
          curl -LO ${base}/docker-compose.yml
          docker compose up -d
          \`\`\`
          Windows (PowerShell) : \`Invoke-WebRequest ${base}/docker-compose.yml -OutFile docker-compose.yml\`, puis \`docker compose up -d\`.
          Puis ouvrir http://localhost:5080 (page Paramètres : token du plugin).

          **Mise à jour** : scripts \`update.sh\` / \`update.ps1\` (sauvegarde des bases, vérification du démarrage).
          Les données (volume Docker) sont conservées.

          **Revenir à cette version** : \`RL_TAG=${VERSION} docker compose up -d\`
          NOTES
          if gh release view server-latest >/dev/null 2>&1; then
            gh release edit server-latest --title "Serveur (Docker) — v${VERSION}" --notes-file notes.md --prerelease
          else
            gh release create server-latest --verify-tag --title "Serveur (Docker) — v${VERSION}" --notes-file notes.md --prerelease
          fi
          gh release upload server-latest out/docker-compose.yml out/update.sh out/update.ps1 --clobber
          {
            echo "### Serveur v${VERSION}"
            echo "- Image : \`${IMAGE}:latest\` (\`:${VERSION}\`, \`:sha-${GITHUB_SHA}\`)"
            echo "- docker-compose : ${base}/docker-compose.yml"
          } >> "$GITHUB_STEP_SUMMARY"
